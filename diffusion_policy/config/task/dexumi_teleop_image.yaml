name: dexumi_teleop_image

image_shape: [3, 224, 224]
dataset_path: data/dexumi_replay_buffer

shape_meta: &shape_meta
  obs:
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    robot_eef_pose:
      shape: [6]
      type: low_dim
    hand_command:
      shape: [6]
      type: low_dim
  action:
    shape: [6]

env_runner: null

dataset:
  _target_: diffusion_policy.dataset.dexumi_teleop_image_dataset.DexUmiTeleopImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${horizon}-${n_obs_steps}'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
