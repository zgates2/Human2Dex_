seed: 42

data:
  data_root: data/pick_2
  index_dir: wrist/outputs/index
  image_size: 448
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  wrist_zero_tol_m: 0.0001

model:
  dino_dir: wrist/dino
  feature_dim: 384
  patch_size: 16
  pooling_dropout: 0.0
  head_dropout: 0.1

loss:
  joint_beta: 0.005
  bone_length_weight: 0.1
  bone_direction_weight: 0.05

train:
  # Per-GPU batch size. Effective batch = batch_size * num_gpus * grad_accum_steps.
  # For 8xA100 this starts at 64 * 8 = 512. If GPU utilization is still low and
  # memory is safe, try --batch-size 96 or 128.
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  epochs_stage_a: 20
  epochs_stage_b: 50
  head_lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.05
  warmup_epochs: 5
  grad_clip: 1.0
  grad_accum_steps: 1
  precision: bf16
  unfreeze_last_blocks: 4
  channels_last: true
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high

eval:
  num_visuals: 8
  # Visualization can stall rank0 when matplotlib is slow; save every 5 epochs
  # on the full 8-GPU run.
  save_visuals_every: 5

projection:
  intrinsics_yaml: wrist/configs/fisheye_calib.yaml
  camera_T_hand: null

output:
  run_dir: wrist/outputs/runs
